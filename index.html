<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Семейное древо отряда</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <div class="bg-decoration">
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>
        <div class="bg-circle bg-circle-3"></div>
    </div>

    <header class="header">
        <div class="header-content">
            <div class="logo">🌳</div>
            <div class="header-text">
                <h1>Семейное древо</h1>
                <p>Педагогический отряд</p>
            </div>
        </div>
    </header>

    <main class="main">
        
        <!-- Статистика -->
        <section class="stats-section" id="statsSection">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-number" id="statPeople">0</div>
                    <div class="stat-label">Человек</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📅</div>
                    <div class="stat-number" id="statYears">0</div>
                    <div class="stat-label">Лет</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👨‍👩‍👧</div>
                    <div class="stat-number" id="statCurators">0</div>
                    <div class="stat-label">Кураторов</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎓</div>
                    <div class="stat-number" id="statGroups">0</div>
                    <div class="stat-label">Групп</div>
                </div>
            </div>
        </section>

        <!-- Табы для переключения функций -->
        <section class="tabs-section" id="tabsSection">
            <div class="tabs">
                <button class="tab active" data-tab="tree">🌳 Древо</button>
                <button class="tab" data-tab="connection">🔗 Связь</button>
                <button class="tab" data-tab="ancestors">👨‍👩‍👧 Предки</button>
            </div>
        </section>

        <!-- Таб: Дерево -->
        <section class="tab-content active" id="tabTree">
            <div class="filters-section" id="filtersSection">
                <div class="filters-row">
                    <button class="filter-chip active" data-filter="all">Все</button>
                    <select id="yearFilter" class="filter-select">
                        <option value="">Год</option>
                    </select>
                    <select id="groupFilter" class="filter-select">
                        <option value="">Группа</option>
                    </select>
                </div>
                <div class="search-wrapper-full">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input type="text" id="searchBox" class="search-input" placeholder="Поиск по имени...">
                </div>
            </div>
            <div class="tree-section" id="treeContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Загружаем данные...</p>
                </div>
            </div>
        </section>

        <!-- Таб: Поиск связи -->
        <section class="tab-content" id="tabConnection">
            <div class="connection-section">
                <div class="section-header">
                    <h2>🔗 Найти связь</h2>
                    <p>Выбери двух человек</p>
                </div>
                
                <div class="connection-form">
                    <div class="search-select-wrapper">
                        <div class="search-select">
                            <input type="text" class="search-select-input" id="person1Input" placeholder="Первый человек..." autocomplete="off">
                            <input type="hidden" id="person1Select" value="">
                            <div class="search-select-dropdown" id="person1Dropdown"></div>
                        </div>
                    </div>
                    
                    <div class="connection-arrow">↔</div>
                    
                    <div class="search-select-wrapper">
                        <div class="search-select">
                            <input type="text" class="search-select-input" id="person2Input" placeholder="Второй человек..." autocomplete="off">
                            <input type="hidden" id="person2Select" value="">
                            <div class="search-select-dropdown" id="person2Dropdown"></div>
                        </div>
                    </div>
                </div>
                
                <button class="btn btn-primary btn-full" id="findConnectionBtn" disabled>
                    🔍 Найти связь
                </button>
                
                <div class="connection-result" id="connectionResult"></div>
            </div>
        </section>

        <!-- Таб: Древо предков -->
        <section class="tab-content" id="tabAncestors">
            <div class="ancestors-section">
                <div class="section-header">
                    <h2>👨‍👩‍👧 Древо предков</h2>
                    <p>Выбери человека, чтобы увидеть его предков</p>
                </div>
                
                <div class="search-select-wrapper-full">
                    <div class="search-select">
                        <input type="text" class="search-select-input" id="ancestorPersonInput" placeholder="Выбери человека..." autocomplete="off">
                        <input type="hidden" id="ancestorPersonSelect" value="">
                        <div class="search-select-dropdown" id="ancestorPersonDropdown"></div>
                    </div>
                </div>
                
                <button class="btn btn-primary btn-full" id="showAncestorsBtn" disabled>
                    🌳 Показать древо предков
                </button>
                
                <div class="ancestors-result" id="ancestorsResult"></div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <p>Сделано с 💚 для нашего отряда</p>
    </footer>

    <!-- Модальное окно профиля -->
    <div class="modal-overlay" id="personModal">
        <div class="modal modal-person">
            <button class="modal-close" onclick="closePersonModal()">✕</button>
            
            <div class="modal-header">
                <div class="modal-avatar" id="modalAvatar"></div>
                <h2 class="modal-name" id="modalName"></h2>
            </div>
            
            <div class="modal-body">
                <div class="modal-info" id="modalInfo"></div>
                <div class="modal-actions" id="modalActions"></div>
                <div class="modal-family" id="modalFamily"></div>
            </div>
        </div>
    </div>

    <!-- Модальное окно группы -->
    <div class="modal-overlay" id="groupModal">
        <div class="modal modal-group">
            <button class="modal-close" onclick="closeGroupModal()">✕</button>
            
            <div class="modal-header">
                <h2 class="modal-title" id="groupModalTitle"></h2>
                <p class="modal-subtitle" id="groupModalSubtitle"></p>
            </div>
            
            <div class="modal-body" id="groupModalContent"></div>
        </div>
    </div>

    <script src="js/index.js"></script>

</body>
</html>
