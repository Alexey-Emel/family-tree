<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейное древо отряда</title>
    
    <!-- Подключаем шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Подключаем наши стили -->
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <!-- Декоративный фон -->
    <div class="bg-decoration">
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>
        <div class="bg-circle bg-circle-3"></div>
    </div>

    <!-- Шапка сайта -->
    <header class="header">
        <div class="header-content">
            <div class="logo">🌳</div>
            <div class="header-text">
                <h1>Семейное древо</h1>
                <p>Педагогический отряд • 21 год истории</p>
            </div>
        </div>
    </header>

    <!-- Главный контент -->
    <main class="main">
        
        <!-- Блок статистики -->
        <section class="stats-section" id="statsSection">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-number" id="statPeople">0</div>
                    <div class="stat-label">Человек</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📅</div>
                    <div class="stat-number" id="statYears">0</div>
                    <div class="stat-label">Лет истории</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👨‍👩‍👧</div>
                    <div class="stat-number" id="statCurators">0</div>
                    <div class="stat-label">Кураторов</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎓</div>
                    <div class="stat-number" id="statGroups">0</div>
                    <div class="stat-label">Групп</div>
                </div>
            </div>
        </section>

                <!-- Блок поиска связи между людьми -->
        <section class="connection-section" id="connectionSection">
            <div class="section-header">
                <h2>🔗 Найти связь</h2>
                <p>Выбери двух человек, чтобы увидеть их родственную связь</p>
            </div>
            
            <div class="connection-form">
                <!-- Первый человек -->
                <div class="search-select-wrapper">
                    <div class="search-select" id="person1SearchSelect">
                        <input type="text" class="search-select-input" id="person1Input" placeholder="Введи имя..." autocomplete="off">
                        <input type="hidden" id="person1Select" value="">
                        <div class="search-select-dropdown" id="person1Dropdown"></div>
                    </div>
                </div>
                
                <div class="connection-arrow">
                    <span>↔</span>
                </div>
                
                <!-- Второй человек -->
                <div class="search-select-wrapper">
                    <div class="search-select" id="person2SearchSelect">
                        <input type="text" class="search-select-input" id="person2Input" placeholder="Введи имя..." autocomplete="off">
                        <input type="hidden" id="person2Select" value="">
                        <div class="search-select-dropdown" id="person2Dropdown"></div>
                    </div>
                </div>
                
                <button class="btn btn-primary" id="findConnectionBtn" disabled>
                    <span>Найти</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </button>
            </div>
            
            <!-- Результат поиска связи -->
            <div class="connection-result" id="connectionResult"></div>
        </section>

        <!-- Фильтры -->
        <section class="filters-section" id="filtersSection">
            <div class="filters-row">
                <button class="filter-chip active" data-filter="all">
                    Всё древо
                </button>
                
                <select id="yearFilter" class="filter-select">
                    <option value="">Год</option>
                </select>
                
                <select id="groupFilter" class="filter-select">
                    <option value="">Группа</option>
                </select>
                
                <div class="search-wrapper">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input type="text" id="searchBox" class="search-input" placeholder="Поиск по имени...">
                </div>
            </div>
        </section>

        <!-- Дерево -->
        <section class="tree-section" id="treeContainer">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Загружаем данные...</p>
            </div>
        </section>

    </main>

    <!-- Футер -->
    <footer class="footer">
        <p>Сделано с 💚 для нашего отряда</p>
    </footer>

    <!-- Модальное окно профиля человека -->
    <div class="modal-overlay" id="personModal">
        <div class="modal modal-person">
            <button class="modal-close" onclick="closePersonModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
            
            <div class="modal-header">
                <div class="modal-avatar" id="modalAvatar"></div>
                <h2 class="modal-name" id="modalName"></h2>
            </div>
            
            <div class="modal-body">
                <div class="modal-info" id="modalInfo"></div>
                <div class="modal-family" id="modalFamily"></div>
            </div>
        </div>
    </div>

    <!-- Модальное окно группы -->
    <div class="modal-overlay" id="groupModal">
        <div class="modal modal-group">
            <button class="modal-close" onclick="closeGroupModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
            
            <div class="modal-header">
                <h2 class="modal-title" id="groupModalTitle"></h2>
                <p class="modal-subtitle" id="groupModalSubtitle"></p>
            </div>
            
            <div class="modal-body" id="groupModalContent"></div>
        </div>
    </div>

    <!-- Подключаем наш скрипт -->
    <script src="js/index.js"></script>

</body>
</html>
